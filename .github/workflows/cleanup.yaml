# This workflow is triggered when a PR is closed. It deletes the temporary Maven packages created by the CI workflow.
name: Cleanup PR Maven packages

on:
  pull_request:
    types: [ closed ]

concurrency: # group matches the concurrency group in the CI workflow and prevents a concurrent CI run from pushing package after the PR is closed
  group: ci-release-${{ github.head_ref }}
  cancel-in-progress: true # cancels all in-progress CI runs

jobs:
  delete-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Delete PR packages
        uses: sicpa-foundations/actions/.github/workflow-actions/ci-maven-cleanup@9f9d3db5345276ba79081a77c532da6807a8cce1 # v1.0.0
        with:
          pr-number: ${{ github.event.number }}
          ghcr-delete-images-pat: ${{ secrets.GITHUB_TOKEN }}
